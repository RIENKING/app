name: TouchForge
options:
  bundleIdPrefix: com.touchforge.ios
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  TouchForge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TouchForge
        excludes:
          - "**/*.plist"
    settings:
      base:
        INFOPLIST_FILE: TouchForge/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.touchforge.ios.app
        PRODUCT_NAME: TouchForge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    frameworks:
      - sdk: SwiftUI.framework
      - sdk: GameController.framework
      - sdk: CoreBluetooth.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: AppIntents.framework
  TouchForgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TouchForgeTests
    dependencies:
      - target: TouchForge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TouchForge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TouchForge"
        BUNDLE_LOADER: "$(TEST_HOST)"
